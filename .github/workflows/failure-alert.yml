name: CI Failure Alert

on:
  workflow_run:
    workflows:
      - "CI"
      - "Security"
      - "Secret Scan"
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  synchronize-alert:
    if: >-
      ${{
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      ALERT_LABEL: ci-failure-alert
    steps:
      - name: Open, update, or resolve the failure alert
        shell: bash
        run: |
          set -euo pipefail

          # Reconcile against the authoritative latest completed run. This makes
          # delayed events and reruns of older commits harmless.
          latest_run="$(
            gh api --method GET \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
              -f branch="${HEAD_BRANCH}" \
              -f status=completed \
              -F exclude_pull_requests=true \
              -F per_page=1
          )"
          latest_id="$(jq -r '.workflow_runs[0].id // empty' <<<"${latest_run}")"
          if [[ "${latest_id}" != "${RUN_ID}" ]]; then
            echo "Ignoring stale workflow_run event ${RUN_ID}; latest is ${latest_id:-none}."
            exit 0
          fi

          conclusion="$(jq -r '.workflow_runs[0].conclusion' <<<"${latest_run}")"
          run_url="$(jq -r '.workflow_runs[0].html_url' <<<"${latest_run}")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha' <<<"${latest_run}")"
          title="CI failure: ${WORKFLOW_NAME}"
          gh label create "${ALERT_LABEL}" --repo "${REPOSITORY}" \
            --color B60205 \
            --description "Owned by the CI failure alert workflow" \
            --force >/dev/null
          issue_number="$(
            gh issue list --repo "${REPOSITORY}" --state open \
              --label "${ALERT_LABEL}" --search "\"${title}\" in:title" --limit 10 \
              --json number,title |
              jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' |
              head -n 1
          )"
          details="Workflow: ${WORKFLOW_NAME}
          Conclusion: ${conclusion}
          Branch: ${HEAD_BRANCH}
          Commit: ${head_sha}
          Run: ${run_url}

          <!-- ci-failure-alert:${WORKFLOW_ID} -->"

          if [[ "${conclusion}" == "failure" || "${conclusion}" == "timed_out" ||
                "${conclusion}" == "startup_failure" || "${conclusion}" == "action_required" ]]; then
            if [[ -n "${issue_number}" ]]; then
              gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${details}"
            else
              create_args=(
                --repo "${REPOSITORY}"
                --title "${title}"
                --body "${details}"
                --label "${ALERT_LABEL}"
              )
              if [[ "${REPOSITORY_OWNER_TYPE}" == "User" ]]; then
                create_args+=(--assignee "${REPOSITORY_OWNER}")
              fi
              gh issue create "${create_args[@]}"
            fi
          elif [[ "${conclusion}" == "success" && -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" \
              --body "Recovered: ${run_url}"
            gh issue close "${issue_number}" --repo "${REPOSITORY}" \
              --reason completed
          fi
