name: CI Failure Alert

on:
  workflow_run:
    workflows:
      - "CI"
      - "Security"
      - "Secret Scan"
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: >-
    ci-failure-alert-${{ github.event.repository.id }}-${{ github.event.workflow_run.workflow_id }}-${{ (github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request') && 'eligible' || 'ignored' }}
  cancel-in-progress: false

jobs:
  synchronize-alert:
    if: >-
      ${{
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      ALERT_LABEL: ci-failure-alert
    steps:
      - name: Open, update, or resolve the failure alert
        shell: bash
        run: |
          set -euo pipefail

          # Every serialized invocation reconciles the authoritative latest
          # completed run. This makes delayed or replaced events harmless.
          head_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          completed_runs="$(
            gh api --paginate --slurp --method GET \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs" \
              -f branch="${head_branch}" \
              -f status=completed \
              -F per_page=100
          )"
          latest_run="$(
            jq -c \
              '[.[] | .workflow_runs[] | select(.event != "pull_request")][0] // empty' \
              <<<"${completed_runs}"
          )"
          latest_id="$(jq -r '.id // empty' <<<"${latest_run:-{}}")"
          if [[ -z "${latest_id}" ]]; then
            echo "No completed default-branch run found for workflow ${WORKFLOW_ID}." >&2
            exit 1
          fi
          latest_attempt="$(jq -r '.run_attempt // empty' <<<"${latest_run:-{}}")"
          if [[ ! "${latest_attempt}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Latest completed run did not include a valid attempt number." >&2
            exit 1
          fi
          workflow_name="$(jq -r '.name // empty' <<<"${latest_run:-{}}")"
          if [[ -z "${workflow_name}" ]]; then
            echo "Latest completed run did not include a workflow name." >&2
            exit 1
          fi
          conclusion="$(jq -r '.conclusion' <<<"${latest_run}")"
          run_url="$(jq -r '.html_url' <<<"${latest_run}")"
          head_sha="$(jq -r '.head_sha' <<<"${latest_run}")"
          title="CI failure: ${workflow_name}"
          gh label create "${ALERT_LABEL}" --repo "${REPOSITORY}" \
            --color B60205 \
            --description "Owned by the CI failure alert workflow" \
            --force >/dev/null
          marker_prefix="<!-- ci-failure-alert:${WORKFLOW_ID}:"
          legacy_marker="<!-- ci-failure-alert:${WORKFLOW_ID} -->"
          open_alerts="$(
            gh api --paginate --slurp --method GET \
              "repos/${REPOSITORY}/issues" \
              -f state=open \
              -f labels="${ALERT_LABEL}" \
              -F per_page=100
          )"
          issue_record="$(
            jq -c --arg title "${title}" \
              --arg marker_prefix "${marker_prefix}" \
              --arg legacy_marker "${legacy_marker}" \
              '[.[][] |
                select(
                  .title == $title ||
                  ((.body // "") | contains($marker_prefix)) ||
                  ((.body // "") | contains($legacy_marker))
                )
              ][0] // empty' <<<"${open_alerts}"
          )"
          issue_number="$(jq -r '.number // empty' <<<"${issue_record:-{}}")"
          run_marker="<!-- ci-failure-alert:${WORKFLOW_ID}:${latest_id}:${latest_attempt} -->"
          details="Workflow: ${workflow_name}
          Conclusion: ${conclusion}
          Branch: ${head_branch}
          Commit: ${head_sha}
          Attempt: ${latest_attempt}
          Run: ${run_url}

          ${run_marker}"

          if [[ "${conclusion}" == "failure" || "${conclusion}" == "timed_out" ||
                "${conclusion}" == "startup_failure" || "${conclusion}" == "action_required" ]]; then
            if [[ -n "${issue_number}" ]]; then
              recorded_details="$(
                {
                  gh issue view "${issue_number}" --repo "${REPOSITORY}" \
                    --json body --jq '.body'
                  gh api --paginate --method GET \
                    "repos/${REPOSITORY}/issues/${issue_number}/comments" \
                    -F per_page=100 --jq '.[].body'
                }
              )"
              if ! grep -Fq -- "${run_marker}" <<<"${recorded_details}"; then
                gh issue comment "${issue_number}" --repo "${REPOSITORY}" --body "${details}"
              fi
            else
              create_args=(
                --repo "${REPOSITORY}"
                --title "${title}"
                --body "${details}"
                --label "${ALERT_LABEL}"
              )
              if [[ "${REPOSITORY_OWNER_TYPE}" == "User" ]]; then
                create_args+=(--assignee "${REPOSITORY_OWNER}")
              fi
              gh issue create "${create_args[@]}"
            fi
          elif [[ "${conclusion}" == "success" && -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --repo "${REPOSITORY}" \
              --body "Recovered: ${run_url}"
            gh issue close "${issue_number}" --repo "${REPOSITORY}" \
              --reason completed
          fi
