name: Refresh frontend lockfile

on:
  push:
    branches:
      - fix/ci-failure-alert-json
    paths:
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ci-failure-alert-json

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/control-plane/package-lock.json

      - name: Refresh vulnerable dependency resolutions
        working-directory: frontend/control-plane
        run: npm audit fix --package-lock-only --no-fund

      - name: Validate lockfile and frontend
        working-directory: frontend/control-plane
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test:coverage
          npm run build
          npm audit --audit-level=high

      - name: Ensure manifest was not broadened
        run: git diff --exit-code -- frontend/control-plane/package.json

      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- frontend/control-plane/package-lock.json; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/control-plane/package-lock.json
          git commit -m "Refresh frontend security lockfile"
          git push
